[project]
name = "whatsapp-cli"
version = "0.2.0"
description = "Command-line client for a whatsmeow Go bridge: read, search, and send WhatsApp messages from the shell."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
whatsapp = "whatsapp_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whatsapp_cli"]
